plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.sailpunchlist.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sailpunchlist.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.assets.srcDirs = ['src/main/assets', "$buildDir/checklists"]
}
// Package only static content; neither app needs a shared runtime.
tasks.register('copyChecklists', Copy) {
    from rootProject.file('../checklists.json')
    into layout.buildDirectory.dir('checklists')
}
tasks.named('preBuild').configure { dependsOn 'copyChecklists' }
